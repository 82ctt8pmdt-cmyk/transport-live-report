<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Транспорт · сентябрь 2026</title>
  <style>
    :root{font:15px/1.5 system-ui,sans-serif;color:#24313b;background:#f7f8fa;letter-spacing:0}
    body{margin:0}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
    #status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
    #status strong{font-size:20px}#status p{color:#606e79;max-width:36em;margin:12px auto}
    #status progress{width:min(320px,75vw);height:8px;accent-color:#277f76;justify-self:center}
    #status progress[hidden]{display:none}
    #status.loaded{inset:auto 12px 12px auto;display:block;background:#fff;border:1px solid #d5dce2;border-radius:4px;padding:8px 12px;max-width:calc(100% - 48px);box-shadow:0 2px 12px #0001;font-size:13px;z-index:2}
    #status.loaded strong{font-size:13px}#status.loaded p{margin:2px 0 0}#status[hidden]{display:none}
    iframe.pending{visibility:hidden;pointer-events:none}
  </style>
</head>
<body>
  <section id="status" role="status" aria-live="polite"><strong>Транспорт · сентябрь 2026</strong><p>Проверка актуальной версии…</p><progress aria-label="Загрузка отчёта" hidden></progress><a id="public-report" href="https://82ctt8pmdt-cmyk.github.io/transport-live-report/" hidden>Открыть отчёт</a></section>
  <script id="start-report">
    if (location.protocol === "file:") {
      const link = document.getElementById("public-report");
      link.hidden = false;
      document.querySelector("#status p").textContent = "Открываем публичный отчёт…";
      const address = new URL(link.href);
      address.search = location.search;
      address.hash = location.hash;
      location.replace(address.href);
    } else {
      const script = document.createElement("script");
      script.type = "module";
      script.src = "./app.js?v=7";
      const fail = function () {
        document.querySelector("#status p").textContent = "Не загрузился код просмотра отчёта. Повторим подключение автоматически.";
        setTimeout(function () { if (!document.documentElement.dataset.loaderStarted) location.reload(); }, 30000);
      };
      const timeout = setTimeout(function () { if (!document.documentElement.dataset.loaderStarted) fail(); }, 15000);
      script.onload = function () { clearTimeout(timeout); };
      script.onerror = function () { clearTimeout(timeout); fail(); };
      document.body.append(script);
    }
  </script>
  <noscript>Для отображения интерактивного отчёта требуется браузер с включённым JavaScript.</noscript>
</body>
</html>
